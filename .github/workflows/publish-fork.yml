name: publish-fork

# Fork releases. Push a `fork-v<semver>` tag (e.g. fork-v0.10.0) to build the
# renderer and publish ghcr.io/<owner>/kindle-dash:<semver>, which servarr pins.
# The `fork-` prefix keeps these tags apart from the upstream v* tags.
# publish.yml stays upstream-only: it pushes to ErikBPF's registry and repos.
on:
  push:
    tags: ["fork-v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-fork
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository != 'ErikBPF/kindle-dash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Image name and version
        id: meta
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#fork-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not fork-v<major>.<minor>.<patch>"
            exit 1
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kindle-dash" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./renderer
          file: ./renderer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Release summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo
            echo "\`${IMAGE}:${VERSION}\`"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
